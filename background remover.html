<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Background Remover Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    input[type="file"] {
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 5px;
    }
    img {
      margin-top: 20px;
      max-width: 500px;
      border: 2px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Background Remover Tool</h1>
  <input type="file" id="imageInput" accept="image/*">
  <button id="removeBtn">Remove Background</button>
  <img id="result" src="" alt="Result will appear here">

  <script>
    const apiKey = "bg_live_sk_31961f46ceccb64ccb93a8cf52b77bb3752e1880318e7ba097d43a3b2d37f78b";

    document.getElementById('removeBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('imageInput');
      if (!fileInput.files.length) {
        alert("Please select an image first!");
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("image_file", file);
      formData.append("size", "auto");

      const resultImg = document.getElementById('result');
      resultImg.src = "";
      resultImg.alt = "Processing...";

      try {
        const response = await fetch("https://api.remove.bg/v1.0/removebg", {
          method: "POST",
          headers: {
            "X-Api-Key": apiKey
          },
          body: formData
        });

        if (!response.ok) throw new Error("Failed to remove background");

        const blob = await response.blob();
        resultImg.src = URL.createObjectURL(blob);
        resultImg.alt = "Background removed!";
      } catch (error) {
        alert("Error: " + error.message);
        resultImg.alt = "Error occurred";
      }
    });
  </script>

</body>
</html>
